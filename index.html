<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperIntelligence Hub | Web App Prototype</title>
<!-- Self-contained fonts: system stacks only; no external font or script requests. -->
<style>
:root{
  --paper:#F2F4F9;--surface:#FFFFFF;--surface2:#F7F8FC;--ink:#0E1A33;--muted:#59657D;--line:#E1E6F0;--line2:#C9D1E2;
  --brand:#F39A0E;--brand-soft:#FFF1DA;--brand-ink:#8A5200;--hubink:#2A1700;
  --blue:#2D4FD6;--blue-soft:#E8EDFF;--ok:#12805C;--ok-soft:#DDF5EA;--warn:#B45309;--warn-soft:#FEF0D6;--bad:#B42318;--bad-soft:#FDE7E4;
  --rail:#0B1430;--rail-ink:#B9C4E2;--node:#DCE9FA;--nodeline:#3A4A9F;
  --shadow:0 1px 0 rgba(14,26,51,.04),0 14px 30px -18px rgba(24,40,110,.35);
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--font-b:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
:root[data-theme=dark]{
  --paper:#0A1020;--surface:#111A32;--surface2:#0E1730;--ink:#EAF0FF;--muted:#9AA7C4;--line:#223052;--line2:#33466F;
  --brand:#FFB23E;--brand-soft:#3A2A0A;--brand-ink:#FFD28A;--blue:#8DA2FF;--blue-soft:#1A2550;
  --ok:#46D3A0;--ok-soft:#0F3A2D;--warn:#FFC266;--warn-soft:#3B2B0C;--bad:#FF8E84;--bad-soft:#3E1713;
  --rail:#070D20;--node:#1A2550;--nodeline:#8DA2FF;--shadow:0 1px 0 rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-b);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-d);margin:0;letter-spacing:-.02em;line-height:1.1}
p{margin:0}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:0;height:100vh;background:var(--rail);color:var(--rail-ink);padding:20px 14px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;color:#fff}
.mark{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;color:var(--hubink);flex:none}
.brand b{font:700 17px/1.05 var(--font-d);display:block;letter-spacing:-.01em}
.brand small{font-size:11.5px;color:var(--rail-ink);display:block;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--rail-ink);text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.nav .count{margin-left:auto;background:var(--brand);color:var(--hubink);font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px}
.rail .grow{flex:1}
.rolebox{position:relative}
.rolebtn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;text-align:left}
.rolebtn small{display:block;color:var(--rail-ink);font-size:11.5px}
.rolebtn .av{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font:700 12px var(--font-d);flex:none;color:#fff}
.rolemenu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);display:none;z-index:30}
.rolemenu.open{display:block}
.rolemenu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:8px 10px}
.rolemenu button:hover,.rolemenu button.on{background:var(--surface2)}
.rolemenu small{color:var(--muted);display:block;font-size:12px}
.rolemenu .grp{font-size:11.5px;color:var(--muted);padding:6px 10px 2px}
.classif{font-size:11px;color:#7E8BB0;padding:10px 8px 0}
/* main */
main{padding:0 clamp(18px,4vw,52px) 90px;max-width:1280px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.chip-sample{white-space:nowrap;font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);padding:4px 11px;border-radius:99px;font-weight:500}
.tools{display:flex;gap:8px;align-items:center}
.iconbtn{height:38px;min-width:38px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.iconbtn kbd{font:500 11.5px var(--font-b);border:1px solid var(--line);border-radius:6px;padding:0 5px;background:var(--surface2)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
:root[data-theme=dark] .btn.primary{background:var(--brand);color:var(--hubink);border-color:var(--brand)}
.btn.amber{background:var(--brand);border-color:var(--brand);color:var(--hubink);font-weight:600}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px 3px 7px;border-radius:99px;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);white-space:nowrap}
.badge .ico{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.muted{color:var(--muted)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:14px 0 24px}
.pagehead h1{font-size:clamp(30px,4vw,40px)}
.pagehead p{color:var(--muted);margin-top:8px;max-width:60ch}
mark{background:var(--brand-soft);color:inherit;border-radius:4px;padding:0 2px;box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 35%,transparent)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding:20px 0 30px}
.hero h1{font-size:clamp(38px,5.2vw,64px);font-weight:800;letter-spacing:-.035em}
.lede{font-size:17px;color:var(--muted);margin:18px 0 26px;max-width:52ch}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line2);border-radius:18px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);transition:border-color .15s}
.searchbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;height:46px}
.searchbox .ico{color:var(--muted);width:22px;height:22px}
.tryrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:13.5px;color:var(--muted)}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13.5px}
.chip:hover{border-color:var(--brand);background:var(--brand-soft)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
:root[data-theme=dark] .chip.on{background:var(--brand);color:var(--hubink);border-color:var(--brand)}
.hero-r{padding:18px 18px 14px}
.caption{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;min-height:20px}
/* hub svg */
.hubsvg{width:100%;height:auto;display:block}
.cn rect{fill:var(--node);stroke:var(--nodeline);stroke-width:1.2;transition:all .2s}
.cn text{fill:var(--ink);font:500 13px var(--font-b);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cn.lit rect{fill:var(--brand-soft);stroke:var(--brand);stroke-width:2.2}
.cn.me rect{stroke:var(--blue);stroke-width:2.6}
.cn.pick rect{stroke:var(--brand);stroke-width:2.6}
.hubnode rect{fill:var(--brand);stroke:none}
.hubnode text{fill:var(--hubink);font:800 15px var(--font-d);text-anchor:middle}
.hubnode .sm{font:500 10.5px var(--font-b)}
.hubnode.pulse rect{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.12)}}
.cl{stroke:var(--line2);stroke-width:2;fill:none;transition:stroke .2s}
.cl.flow{stroke:var(--brand);stroke-dasharray:7 7;animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.mod rect{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1}
.mod text{fill:var(--ink);font:500 12px var(--font-b);text-anchor:middle;dominant-baseline:central}
.cn[data-node]{cursor:pointer}
/* results */
.sect{margin-top:8px}
.sect h2{font-size:21px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.panel{padding:20px}
.panel h3{font-size:17px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px 8px;margin:0 -8px;border-radius:10px;width:calc(100% + 16px)}
.row:hover{background:var(--surface2)}
.row .t{font-weight:500;line-height:1.35}
.row .s{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.featured{overflow:hidden;margin-bottom:22px}
.featured .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 24px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13.5px}
.featured .body{padding:24px}
.featured h2{font-size:27px;margin:12px 0 10px}
.answer{font-size:18px;line-height:1.5;max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--muted);font-size:13px;margin-top:16px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.actions .sep{flex:1}
.fb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.fb button.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rot{transform:rotate(180deg)}
.listcard{padding:6px 20px}
.listcard .row{border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:14px 0;width:100%}
.listcard .row:last-child{border:0}
.gaprow{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:26px;flex-wrap:wrap}
.gaprow h3{font-size:21px;margin-bottom:6px}
/* library */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;display:flex;gap:8px;align-items:center;font-weight:500}
.tab small{color:var(--muted);font-weight:400}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.on small{color:inherit;opacity:.75}
:root[data-theme=dark] .tab.on{background:var(--brand);color:var(--hubink);border-color:var(--brand)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.field{height:40px;border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:0 12px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ecard{padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%;transition:transform .15s,border-color .15s}
.ecard:hover{transform:translateY(-2px);border-color:var(--brand)}
.ecard h3{font-size:18px;line-height:1.2}
.ecard p{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ecard .foot{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:4px}
.ecard .foot span{display:inline-flex;align-items:center;gap:6px}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(6,12,30,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--surface);z-index:60;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:auto;border-left:1px solid var(--line)}
.drawer.open{transform:none;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
.drawer .in{padding:22px 28px 40px}
.drawer h2{font-size:30px;margin:14px 0 12px}
.dhead{display:flex;justify-content:space-between;align-items:center}
.callout{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:17px;line-height:1.5;margin:16px 0}
.dsec{margin-top:24px}
.dsec h3{font-size:16px;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li label{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.steps li label:hover{border-color:var(--line2)}
.steps input{margin-top:4px;accent-color:var(--brand);width:17px;height:17px}
.steps input:checked+span{color:var(--muted);text-decoration:line-through}
ul.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.notapply{background:var(--warn-soft);border-radius:14px;padding:14px 18px}
.notapply h3{color:var(--warn)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;z-index:70;padding:26px;opacity:0;pointer-events:none;transition:all .2s;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h2{font-size:24px;margin-bottom:6px}
.form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
.form label span.h{font-weight:400;color:var(--muted);font-size:12.5px}
.form input,.form select,.form textarea{border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:10px 12px;width:100%}
.form textarea{min-height:84px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .check{flex-direction:row;align-items:center;gap:10px;font-weight:400}
.form .check input{width:auto;accent-color:var(--brand)}
.form .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:13px;z-index:90;opacity:0;pointer-events:none;transition:all .25s;max-width:min(92vw,520px);font-size:14px}
:root[data-theme=dark] .toast{background:var(--brand);color:var(--hubink)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* palette */
.pal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:18px;z-index:80;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);display:none;overflow:hidden}
.pal.open{display:block}
.pal input{width:100%;border:0;outline:0;background:none;padding:18px 20px;font-size:17px;border-bottom:1px solid var(--line)}
.pal ul{list-style:none;margin:0;padding:8px;max-height:50vh;overflow:auto}
.pal li button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px}
.pal li button.sel{background:var(--surface2);box-shadow:inset 3px 0 0 var(--brand)}
.pal .hint{padding:9px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
/* queue */
.qcard{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.qcard + .qcard{margin-top:12px}
.qcard h3{font-size:18px;margin:8px 0 4px}
.qcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:18px}
.slabel{font:700 18px var(--font-d);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.upload-panel{margin:0 0 22px}.uploadrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.uploadrow input{flex:1;min-width:220px;padding:10px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface2)}.upload-results{display:grid;gap:8px;margin-top:12px}.upload-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}.upload-item small{display:block;color:var(--muted)}
/* document upload */
.upload-panel{padding:22px}
.uphead h3{font-size:20px;margin-bottom:6px}.uphead p{max-width:72ch;font-size:14.5px}
.dz{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 18px;margin-top:16px;border:2px dashed var(--line2);border-radius:16px;background:var(--surface2);cursor:pointer;transition:border-color .15s,background .15s}
.dz:hover,.dz.over{border-color:var(--brand);background:var(--brand-soft)}
.dz:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.dz input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.dz small{color:var(--muted)}
.dzico{width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--hubink);display:grid;place-items:center;margin-bottom:4px}
.filelist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.filelist:empty{display:none}
.uprow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:16px}.uprow .sep{flex:1}
.upfield{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
.upcheck{display:flex;gap:8px;align-items:center;font-size:14px;height:40px}.upcheck input{accent-color:var(--brand);width:17px;height:17px}
.upcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface2)}
.uphd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.uphd small{display:block;color:var(--muted);margin-top:2px}
.mixline{margin:10px 0 4px;font-weight:500}
.upcard .acts{margin-top:10px}
.upload-item.bad{border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:progress}
/* insights */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi{padding:18px 20px}
.kpi .n{font:800 34px/1 var(--font-d);letter-spacing:-.03em;margin:8px 0 6px}
.kpi .l{color:var(--muted);font-size:13.5px}
.kpi .d{font-size:12.5px;margin-top:8px;color:var(--ok);font-weight:500}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.chart{width:100%;height:auto}
.chart rect{fill:var(--line2)}
.chart rect.hi{fill:var(--brand)}
.chart text{fill:var(--muted);font:12px var(--font-b)}
.covrow{display:grid;grid-template-columns:110px 1fr 28px;gap:12px;align-items:center;margin:12px 0;font-size:14px}
.covbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}
.covbar i{display:block;background:var(--tc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--tc);display:inline-block}
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toplist li:last-child{border:0}
.bar{height:6px;border-radius:9px;background:var(--surface2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
/* case */
.casegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.slider{margin:0 0 20px}
.slider .top{display:flex;justify-content:space-between;font-weight:500;font-size:14px;margin-bottom:6px}
.slider output{font-family:var(--font-d);font-weight:700}
input[type=range]{width:100%;accent-color:var(--brand)}
.result{background:var(--rail);color:#fff;border-radius:20px;padding:28px;position:sticky;top:20px;align-self:start}
.result .big{font:800 clamp(40px,5vw,60px)/1 var(--font-d);letter-spacing:-.035em;color:var(--brand);margin:10px 0 4px}
.result .sub{color:var(--rail-ink);font-size:14px}
.result .mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14)}
.result .mini b{display:block;font:700 22px var(--font-d)}
.result .mini small{color:var(--rail-ink)}
.roadmap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:10px}.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:34px}.targets .kpi .n{color:var(--brand-ink)}:root[data-theme=dark] .targets .kpi .n{color:var(--brand)}
.phase{padding:20px;position:relative}
.phase .wk{font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);display:inline-block;padding:2px 10px;border-radius:99px;font-weight:600}
.phase h3{font-size:18px;margin:12px 0 8px}
.phase ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:5px}
.fine{font-size:12.5px;color:var(--muted);margin-top:16px}
/* blueprint */
.bpgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.flowsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.flowsteps .card{padding:18px}
.flowsteps h3{font-size:17px;margin:6px 0}
.flowsteps p{font-size:14px;color:var(--muted)}
table.m{width:100%;border-collapse:collapse;font-size:14px}
table.m th,table.m td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center}
table.m th:first-child,table.m td:first-child{text-align:left}
table.m th{font-weight:600;color:var(--muted);font-size:13px}
table.m td .y{color:var(--ok);font-weight:700}
table.m td .n{color:var(--line2)}
.tscroll{overflow:auto}
@media (max-width:1060px){
  .kpis{grid-template-columns:repeat(2,1fr)}.roadmap,.flowsteps{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr 1fr}.bpgrid,.casegrid{grid-template-columns:1fr}.result{position:static}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px;z-index:40;align-items:center;gap:4px}
  .brand,.rail .grow,.classif{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;padding:6px 4px;font-size:10.5px;text-align:center;align-items:center;width:auto;min-width:0}
  .nav button.active{box-shadow:none;color:var(--brand)}
  .nav .count{position:absolute;margin:0;transform:translate(14px,-6px);padding:0 6px;font-size:10px}
  .nav button{position:relative}
  .rolebox{display:none}
  .hero{grid-template-columns:1fr}
  .grid3,.two{grid-template-columns:1fr}
  main{padding-bottom:110px}
  .qcard{grid-template-columns:1fr}
}
@media (max-width:520px){
  .chip-sample .lg,.iconbtn kbd,[data-act=reset]{display:none}
  .kpis,.roadmap,.flowsteps{grid-template-columns:1fr}.form .two{grid-template-columns:1fr}
  .searchbox .btn{display:none}.nav button span.lbl{display:none}
  .nav button span.lbl2{display:inline}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  E('f1','faq',"A customer doesn't recognise a charge. What do I do?",'Look the charge up in the billing tool first. If it matches a valid invoice, explain it and send a copy. If not, start an invoice dispute.','billing',6,120,2,205,['cs','nvo'],['charge','invoice','unrecognised','dispute','statement'],['Search the charge by amount and date','Match it to an invoice line','If it matches: explain and send the invoice copy','If it does not: follow the invoice dispute SOP']),

  E('s1','sop','Handle an invoice dispute end to end','Log, verify, decide and close within 5 business days. The customer gets an update at day 2 and at closure.','billing',7,90,3,276,['cs','nvo'],['invoice','dispute','sop','process','charge','billing'],['Open a dispute case and attach the invoice','Confirm the disputed lines with the customer','Check usage and contract rates in the billing tool','Decide: correct, credit or uphold the invoice','Tell the customer the outcome and the reason','Close the case and record the root cause']),
  E('s2','sop','Escalate a P1 client issue','Page the on-call lead, open a bridge and send the first client update within 15 minutes.','support',5,90,3,214,A,['p1','escalate','escalation','incident','urgent','outage'],['Confirm it meets P1 criteria','Page the on-call lead from the escalation sheet','Open the incident bridge and add the client contact','Send the first client update within 15 minutes','Update every 30 minutes until resolved','Write the closure summary within one business day']),
  E('s3','sop','Redact personal data from a research deliverable','Run the PII scan, review every flag by hand, remove direct identifiers and aggregate small groups before release.','compliance',14,90,2,163,['research'],['pii','redact','personal data','privacy','research','anonymise'],['Run the PII scan on the final draft','Review every flagged item by hand','Replace names with role labels and remove contact details','Aggregate groups of fewer than 5 people','Save the redacted version as a separate file','Compliance spot-checks 1 in 10 deliverables']),

const stem=w=>w.length>4?w.replace(/(ing|ed|es|s)$/,''):w;
function tokens(q){return q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>1&&!STOP.has(w))}
function expand(q){
  const base=tokens(q),map=new Map();
  base.forEach(t=>map.set(stem(t),1));
  const low=q.toLowerCase();
  SYN.forEach(g=>{
    const hit=g.some(m=>m.includes(' ')?low.includes(m):base.some(t=>stem(t)===stem(m)));
    if(hit)g.forEach(m=>{const k=m.includes(' ')?m:stem(m);if(!map.has(k))map.set(k,.5)});
  });
  return {base,terms:[...map.entries()]};
}
function scoreEntry(e,ex){
  const title=e.title.toLowerCase(),tags=e.tags.join(' ').toLowerCase(),ans=e.answer.toLowerCase(),body=e.points.concat(e.notApply).join(' ').toLowerCase();
  let s=0;
  ex.terms.forEach(([t,w])=>{
    if(title.includes(t))s+=5*w;
    if(tags.includes(t))s+=4*w;
    if(ans.includes(t))s+=2*w;
    if(body.includes(t))s+=1*w;
  });
  const all=ex.base.length&&ex.base.every(b=>{const k=stem(b);return title.includes(k)||tags.includes(k)||ans.includes(k)||body.includes(k)});
  if(all)s+=3;
  if(s>0){if(e.applies.includes(S.role))s+=1.5;s+=Math.min(e.uses,500)/500}
  return s;
}
function search(q,pool){
  const ex=expand(q);if(!ex.terms.length)return [];
  return (pool||live()).map(e=>({e,s:scoreEntry(e,ex)})).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s);
}
function hl(text,q){
  const ts=tokens(q).map(stem).filter(t=>t.length>=3);
  if(!ts.length)return esc(text);
  const re=new RegExp('('+ts.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return String(text).split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
}
function guessDept(q){
  const l=q.toLowerCase();
  if(/refund|invoice|fee|charge|bill|credit|payment|card/.test(l))return 'billing';
  if(/verif|privacy|data|pii|consent|record|source|dataset|legal|retention/.test(l))return 'compliance';
  return 'support';
}

/* --- reading files --- */
async function inflate(u8,kind){
  const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream(kind));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function unzip(buf){

  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('This is not a valid Office file');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={method,csize,off};
    p+=46+nl+xl+cl;
  }
  return {names:Object.keys(files),read:async name=>{
    const f=files[name];if(!f)return null;
    const l=dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u8.subarray(f.off+30+l,f.off+30+l+f.csize);
    return f.method===0?data:await inflate(data,'deflate-raw');

}
const xmlDoc=s=>new DOMParser().parseFromString(s,'application/xml');
const u8text=u=>new TextDecoder('utf-8').decode(u);
const numSort=(a,b)=>parseInt(a.match(/\d+/)[0],10)-parseInt(b.match(/\d+/)[0],10);

async function readDocx(buf){
  const z=await unzip(buf),d=await z.read('word/document.xml');
  if(!d)throw new Error('This Word file has no readable text');
  const out=[];
  for(const p of Array.from(xmlDoc(u8text(d)).getElementsByTagName('w:p'))){
    let t='';
    for(const n of Array.from(p.getElementsByTagName('*'))){if(n.nodeName==='w:t')t+=n.textContent;else if(n.nodeName==='w:tab'||n.nodeName==='w:br')t+=' '}
    t=t.replace(/\s+/g,' ').trim();
    if(!t){out.push('');continue}
    const st=p.getElementsByTagName('w:pStyle')[0],sv=st?(st.getAttribute('w:val')||''):'';
    if(/^(heading|title|subtitle)/i.test(sv))out.push('# '+t);
    else if(p.getElementsByTagName('w:numPr')[0]||/list/i.test(sv))out.push('- '+t);
    else out.push(t);
  }

}
function colIdx(ref){const m=String(ref).match(/^[A-Z]+/);return m?m[0].split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1:0}
async function readXlsx(buf){
  const z=await unzip(buf),ss=[],sx=await z.read('xl/sharedStrings.xml');
  if(sx)Array.from(xmlDoc(u8text(sx)).getElementsByTagName('si')).forEach(si=>ss.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')));
  const out=[];
  for(const sn of z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort(numSort)){
    const rows=[];
    Array.from(xmlDoc(u8text(await z.read(sn))).getElementsByTagName('row')).forEach(r=>{
      const cells=[];
      Array.from(r.getElementsByTagName('c')).forEach(c=>{
        const t=c.getAttribute('t'),vn=c.getElementsByTagName('v')[0],isn=c.getElementsByTagName('is')[0];let v='';
        if(t==='s'&&vn)v=ss[+vn.textContent]||'';
        else if(t==='inlineStr'&&isn)v=Array.from(isn.getElementsByTagName('t')).map(x=>x.textContent).join('');
        else if(vn)v=vn.textContent;
        cells[colIdx(c.getAttribute('r')||'')]=String(v).trim();
      });
      rows.push(cells);
    });
    out.push(rowsToText(rows));
  }
  return out.join('\n');
}
function rowsToText(rows){
  rows=rows.filter(r=>r&&r.some(c=>c));if(!rows.length)return '';
  const head=Array.from(rows[0],c=>String(c||'').toLowerCase());
  const ti=head.findIndex(h=>/^(question|title|topic|rule|name|subject|scenario)/.test(h));
  const ai=head.findIndex(h=>/^(answer|response|guidance|description|policy|details?|summary)/.test(h));
  const si=head.findIndex(h=>/^(steps?|procedure|process|conditions?)/.test(h));
  const ni=head.findIndex(h=>/(not apply|exceptions?|exclusions?)/.test(h));
  if(ti>=0&&ai>=0&&ti!==ai){
    return rows.slice(1).map(r=>{
      const t=String(r[ti]||'').replace(/\s+/g,' ').trim(),a=String(r[ai]||'').replace(/\s+/g,' ').trim();
      if(!t||!a)return '';
      let s='# '+t+'\n'+a;
      if(si>=0&&r[si])s+='\n'+String(r[si]).split(/\s*(?:\n|;)\s*/).filter(Boolean).map(x=>'- '+x).join('\n');
      if(ni>=0&&r[ni])s+='\nDoes not apply when '+String(r[ni]).trim();
      return s;
    }).filter(Boolean).join('\n\n');
  }
  return rows.map(r=>Array.from(r,c=>c||'').filter(Boolean).join(' | ')).join('\n');
}
function parseCsv(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch;
  }
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
async function readPptx(buf){
  const z=await unzip(buf),out=[];
  for(const n of z.names.filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort(numSort)){
    const ps=Array.from(xmlDoc(u8text(await z.read(n))).getElementsByTagName('a:p')).map(p=>Array.from(p.getElementsByTagName('a:t')).map(t=>t.textContent).join('').replace(/\s+/g,' ').trim()).filter(Boolean);
    if(!ps.length)continue;
    out.push('# '+ps[0]);
    ps.slice(1).forEach(l=>out.push(l.length>80?l:'- '+l));
    out.push('');
  }
  return out.join('\n');
}
function pdfText(c){
  const re=/\[((?:\\.|[^\]\\])*)\]\s*TJ|\(((?:\\.|[^)\\])*)\)\s*(?:Tj|'|")|(-?[\d.]+)\s+(-?[\d.]+)\s+T[dD]|T\*|\bET\b/g;
  const mp={n:'\n',r:'',t:' ',b:'',f:'','(':'(',')':')','\\':'\\'};
  const un=s=>s.replace(/\\([nrtbf()\\]|[0-7]{1,3})/g,(_,g)=>g in mp?mp[g]:String.fromCharCode(parseInt(g,8)));
  let o='',m;
  while((m=re.exec(c))){
    if(m[1]!==undefined)o+=m[1].replace(/\(((?:\\.|[^)\\])*)\)|(-?[\d.]+)/g,(x,a,n)=>a!==undefined?un(a):(parseFloat(n)<-200?' ':''));
    else if(m[2]!==undefined)o+=un(m[2]);
    else if(m[3]!==undefined)o+=Math.abs(parseFloat(m[4]))>0.5?'\n':' ';
    else o+='\n';
  }

}
async function readPdf(buf){
  const u8=new Uint8Array(buf),s=new TextDecoder('latin1').decode(u8),out=[],re=/stream\r?\n/g;let m;
  while((m=re.exec(s))){
    const start=m.index+m[0].length,end=s.indexOf('endstream',start);if(end<0)break;
    re.lastIndex=end+9;
    const dict=s.slice(Math.max(0,s.lastIndexOf('obj',m.index)),m.index);
    if(/\/Subtype\s*\/(Image|Form)|\/FontFile|\/XRef|\/ObjStm/.test(dict))continue;
    let e2=end;if(s[e2-1]==='\n')e2--;if(s[e2-1]==='\r')e2--;
    let data=u8.subarray(start,e2);
    try{if(/FlateDecode/.test(dict))data=await inflate(data,'deflate')}catch(_){continue}
    const c=new TextDecoder('latin1').decode(data);
    if(/\b(Tj|TJ)\b/.test(c))out.push(pdfText(c));
  }
  const t=out.join('\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  if(t.length<40)throw new Error('No readable text found. This looks like a scanned or image-only PDF, which needs text recognition in the production backend.');
  return t;
}
async function readDocument(f){
  const n=f.name.toLowerCase();
  if(/\.(txt|md|markdown)$/.test(n))return await f.text();
  if(/\.csv$/.test(n))return rowsToText(parseCsv(await f.text()));
  if(/\.(doc|xls|ppt)$/.test(n))throw new Error('This is an older Office format. Save it as .docx, .xlsx or .pptx and upload it again.');
  if(/\.(docx|xlsx|pptx|pdf)$/.test(n)){
    if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot open this file type. Use a current Chrome, Edge, Safari or Firefox.');
    const b=await f.arrayBuffer();
    return n.endsWith('.docx')?readDocx(b):n.endsWith('.xlsx')?readXlsx(b):n.endsWith('.pptx')?readPptx(b):readPdf(b);
  }
  throw new Error('This file type is not supported yet.');
}

/* --- sorting the text into answers --- */
const BUL=/^([-•*–·]\s+|\d{1,2}[.)]\s+|step\s*\d+\s*[:.\-)]\s*|[a-z][.)]\s+)/i;
const NUMD=/^(\d{1,2}[.)]\s+|step\s*\d+)/i;
const NASTART=/^(does not apply|not applicable|exclusions?|do not use (?:this )?when|not for)\b[:\s,-]*(?:when|if)?\s*/i;
const FILL=new Set(['that','with','from','have','will','their','they','them','been','into','also','then','than','such','each','every','must','should','only','other','which','these','those','where','while','after','before','agents','agent','case','cases','note','below','above']);
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function looksHeading(l,next){
  if(!l||l.length>110)return false;
  if(/^#{1,6}\s+/.test(l))return true;
  if(BUL.test(l)||/[.;,:]$/.test(l))return false;
  const w=l.split(/\s+/);if(w.length>12)return false;
  if(/\?$/.test(l))return true;
  if(l===l.toUpperCase()&&/[A-Z]/.test(l))return true;
  const caps=w.filter(x=>/^[A-Z0-9]/.test(x)).length;
  if(w.length>=2&&caps/w.length>=.6)return true;
  return !!next&&next.length>l.length*1.4&&/[.!?]$/.test(next)&&w.length<=8;
}
function sectionsOf(text){
  const lines=[];
  text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+/g,' ').trim()).forEach(l=>{
    let m;
    if((m=l.match(/^q(?:uestion)?\s*\d*\s*[:.)]\s*(.+)/i))){lines.push('# '+(/\?$/.test(m[1])?m[1]:m[1]+'?'));return}
    if((m=l.match(/^a(?:nswer)?\s*\d*\s*:\s*(.+)/i))){lines.push(m[1]);return}
    lines.push(l);
  });
  const secs=[];let cur=null;
  lines.forEach((l,i)=>{
    if(looksHeading(l,lines[i+1]||lines[i+2]||'')){
      cur={title:l.replace(/^#{1,6}\s+/,'').replace(/^(\d+(\.\d+)*[.)]?|section\s+\d+[:.\-]?)\s+/i,'').replace(/[:\s]+$/,''),body:[]};
      secs.push(cur);
    }else{
      if(!cur){cur={title:'',body:[]};secs.push(cur)}
      cur.body.push(l);
    }
  });
  if(!secs.some(s=>s.title)){
    const paras=[];let p=[];
    secs.flatMap(s=>s.body).forEach(l=>{if(!l){if(p.length)paras.push(p);p=[]}else p.push(l)});
    if(p.length)paras.push(p);
    return paras.filter(q=>q.join(' ').length>=40).map(q=>({title:'',body:q}));
  }
  return secs.filter(s=>s.title||s.body.join(' ').length>=80);
}
function buildEntry(sec,ctx){
  const points=[],prose=[],na=[];let para=[];
  const flush=()=>{if(para.length){prose.push(para.join(' '));para=[]}};
  sec.body.forEach(l=>{
    if(!l){flush();return}
    const isB=BUL.test(l),t=isB?l.replace(BUL,'').trim():l;
    if(NASTART.test(t)){flush();na.push(t.replace(NASTART,'').trim()||t);return}
    if(isB){flush();if(t)points.push(t);return}
    para.push(l);
  });
  flush();
  const sents=s=>(s.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g)||[s]).map(x=>x.trim()).filter(Boolean);
  let answer='',rest=[];
  if(prose.length){
    const ss=sents(prose[0]);answer=ss[0]||'';let k=1;
    while(k<ss.length&&(answer+' '+ss[k]).length<=300){answer+=' '+ss[k];k++}
    rest=ss.slice(k).concat(prose.slice(1).flatMap(sents));
  }else if(points.length){
    answer=points.slice(0,2).map(x=>x.replace(/[.\s]+$/,'')).join('. ')+'.';
  }
  if(!points.length&&rest.length)points.push(...rest.slice(0,6));
  if(answer.length<20&&!points.length)return null;
  if(answer.length>400)answer=answer.slice(0,397).replace(/\s+\S*$/,'')+'…';
  let title=(sec.title||answer.split(/[.!?]/)[0]).trim();
  if(title.length>100)title=title.slice(0,90).replace(/\s+\S*$/,'')+'…';
  title=cap(title);if(!title)return null;
  const tl=title.toLowerCase(),fn=ctx.name.toLowerCase(),hay=(tl+' '+answer+' '+points.join(' ')).toLowerCase();
  const sc={sop:0,faq:0,exception:0,rule:1};
  const numbered=sec.body.filter(l=>NUMD.test(l)).length;
  if(numbered>=3)sc.sop+=4;else if(points.length>=4&&!prose.length)sc.sop+=2;
  if(/\b(step|steps|procedure|workflow|process|how to|checklist|instructions|handle|clear|reset|end to end)\b/.test(tl))sc.sop+=3;
  if(/sop|procedure|workflow|work.?instruction/.test(fn))sc.sop+=1;
  if(/\?$/.test(title))sc.faq+=5;
  if(/^(can|how|what|which|why|when|where|who|is|are|do|does|should)\b/.test(tl))sc.faq+=2;
  if(/faq|question|q.?a/.test(fn))sc.faq+=1;
  if(/exception|special case|edge case|unusual|override|waiver|deviation|bereave|deceased|relay/.test(tl))sc.exception+=4;
  if((hay.match(/\b(unless|except|exceptionally|override)\b/g)||[]).length>=2)sc.exception+=2;
  if(/\b(after|beyond|more than|over)\b.*\b(because|when|if)\b/.test(tl))sc.exception+=4;
  if(/exception|escalat|edge.?case/.test(fn))sc.exception+=1;
  sc.rule+=Math.min((hay.match(/\b(must|shall|policy|rule|limit|within \d+|up to \$|never|required|eligib\w*|approval|authority|allowed|permitted)\b/g)||[]).length,3);
  if(/\b(rule|policy|requirement|limit|eligib\w*|authority|period|levels?|window)\b/.test(tl))sc.rule+=3;
  let type='rule',best=-1;
  ['sop','faq','exception','rule'].forEach(t=>{if(sc[t]>best){best=sc[t];type=t}});
  const freq={};
  (tl+' '+tl+' '+answer+' '+points.join(' ')).toLowerCase().split(/[^a-z0-9]+/).forEach(w=>{if(w.length>=4&&!STOP.has(w)&&!FILL.has(w)&&!/^\d+$/.test(w))freq[w]=(freq[w]||0)+1});
  const tags=[...new Set(tokens(title).concat(Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(x=>x[0])))].slice(0,12);
  return {type,title,answer,tags,
    dept:ctx.dept==='auto'?guessDept(title+' '+answer+' '+points.join(' ')):ctx.dept,
    points:points.slice(0,12),
    notApply:na.map(x=>cap(x.replace(/[.\s]+$/,''))).filter(Boolean).slice(0,6)};
}

/* --- processing and the report --- */
async function processUploads(files){
  if(!canManage()){toast('Only department users can upload documents');return}
  if(!files.length){toast('Choose one or more documents first');return}
  if(uploadBusy)return;
  uploadBusy=true;
  const holdEl=$('#upHold'),deptEl=$('#upDept');
  const hold=holdEl?holdEl.checked:UP.hold,dept=deptEl?deptEl.value:UP.dept;
  UP.hold=hold;UP.dept=dept;
  const out=$('#uploadResults'),btn=$('[data-act=processUploads]');if(btn)btn.disabled=true;
  const existing=new Set(S.entries.map(e=>e.title.trim().toLowerCase()));
  const fresh=[];let total=0;
  for(const f of files){
    if(out)out.innerHTML=fresh.map(c=>c.html).join('')+`<div class="upload-item"><div><b>${esc(f.name)}</b><small>Reading and sorting…</small></div></div>`;
    try{
      const text=await readDocument(f);
      let dup=0;const built=[];
      sectionsOf(text).slice(0,150).forEach(sec=>{
        const b=buildEntry(sec,{name:f.name,dept});if(!b)return;
        const k=b.title.trim().toLowerCase();
        if(existing.has(k)){dup++;return}
        existing.add(k);built.push(b);
      });
      if(!built.length)throw new Error(dup?'Every section in this file is already in the library.':'No answers could be found. Try a document with clear headings, or Question and Answer pairs.');
      const batch='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),stamp=Date.now();
      const made=built.slice(0,80).map((b,i)=>E('d'+stamp.toString(36)+i,b.type,b.title,b.answer,b.dept,0,b.type==='faq'?120:90,1,0,['cs','research','nvo'],b.tags,b.points,b.notApply,{status:hold?'review':'validated',source:f.name,batch,submittedBy:role().name,submittedAt:stamp}));
      S.entries.push(...made);save();total+=made.length;
      fresh.push({batch,html:reportCard(f,text,made,dup,hold,batch)});
    }catch(err){
      fresh.push({batch:null,html:`<div class="upload-item bad"><div><b>${esc(f.name)}</b><small>${esc(err&&err.message||'This file could not be read')}</small></div><span class="pill bad">Not processed</span></div>`});
    }
  }
  uploadBusy=false;
  upCards=fresh.concat(upCards.filter(c=>c.batch)).slice(0,12);
  if(page==='library'){renderLibrary()}
  renderRail();
  toast(total?(hold?`${total} entries sent to Review`:`${total} answers are now live in Ask`):'Nothing was added');
}
function reportCard(f,text,made,dup,hold,batch){
  const by={};made.forEach(e=>{by[e.type]=(by[e.type]||0)+1});
  const mix=Object.entries(by).map(([t,n])=>`${n} ${n===1?TYPES[t].label:TYPES[t].plural}`).join(' · ');
  const words=text.split(/\s+/).filter(Boolean).length;
  return `<div class="upcard"><div class="uphd"><div><b>${esc(f.name)}</b><small>${fmt(words)} words read · ${made.length} ${made.length===1?'answer':'answers'} created${dup?` · ${dup} skipped, already in the library`:''}</small></div><span class="pill ${hold?'warn':'ok'}">${hold?'Waiting in Review':'Live in Ask'}</span></div>
   <p class="mixline">${mix}</p>
   <div class="uplist">${made.slice(0,8).map(e=>`<button class="row" data-act="open" data-id="${e.id}"><div style="flex:1;min-width:0"><div class="t">${esc(e.title)}</div><div class="s">${deptDot(e.dept)}</div></div>${badge(e.type)}</button>`).join('')}${made.length>8?`<p class="muted" style="font-size:13px;padding:6px 0 0">+ ${made.length-8} more in the list below</p>`:''}</div>
   <div class="acts"><button class="btn sm" data-act="undoBatch" data-id="${batch}">Undo this upload</button></div></div>`;
}

/* ---------- DRAWER ---------- */
function openEntry(id){
  const e=byId(id);if(!e)return;
  if(e.status==='validated'){e.uses++;S.recent=[id].concat(S.recent.filter(x=>x!==id)).slice(0,8)}
  save();
  const T=TYPES[e.type];
  const checks=S.done[id]||[];
  const pts=e.points.length?(e.type==='sop'
    ?`<ol class="steps">${e.points.map((p,i)=>`<li><label><input type="checkbox" data-step="${id}:${i}" ${checks.includes(i)?'checked':''}><span>${esc(p)}</span></label></li>`).join('')}</ol>`
    :`<ul class="bul">${e.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`):'';

document.addEventListener('submit',ev=>{
  const f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());const k=f.dataset.form;
  if(k==='entry'){
    const lines=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
    S.entries.push(E('u'+Date.now().toString(36),d.type,d.title.trim(),d.answer.trim(),d.dept,0,90,1,0,['cs','research','nvo'],(d.tags||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).concat(tokens(d.title)),lines(d.points),lines(d.notApply),{status:'review',submittedBy:role().name,submittedAt:Date.now()}));
    save();closeAll();toast('Sent to Compliance for review');render();
  }
  if(k==='request'){
    S.requests.unshift({id:'q'+Date.now().toString(36),q:d.q.trim(),dept:d.dept,from:S.role,urgent:d.urgent==='1',createdAt:Date.now(),status:'open'});
    save();closeAll();toast(`Sent to ${DEPTS[d.dept].name}. Due within ${DEPTS[d.dept].sla} hours`);go('requests');
  }
  if(k==='answer'){
    const q=S.requests.find(x=>x.id===f.dataset.id);if(!q)return;
    q.status='answered';q.answer=d.a.trim();q.answeredBy=q.dept;q.answeredAt=Date.now();
    if(d.pub){S.entries.push(E('u'+Date.now().toString(36),'faq',q.q.replace(/\?*$/,'?'),q.answer,q.dept,0,120,1,0,['cs','research','nvo'],tokens(q.q),[],[],{status:'review',submittedBy:DEPTS[q.dept].name,submittedAt:Date.now()}))}

  }
});

function reqCard(q){

  else{const t=Math.max(1,Math.round((q.answeredAt-q.createdAt)/HR));status=`<span class="pill ok">Answered in ${t} h</span>`}
  const canAns=q.status==='open'&&(S.role===q.dept||S.role==='compliance');
  return `<div class="card qcard" style="margin-bottom:12px"><div><div class="meta" style="margin:0 0 4px"><span>${deptDot(q.dept)}</span><span>from ${esc(from?from.name:'')}</span>${q.urgent?'<span class="pill bad">Urgent</span>':''}${status}</div>

}

  let items=q.trim()?search(q).slice(0,7).map(x=>({t:x.e.title,sub:TYPES[x.e.type].label,i:TYPES[x.e.type].icon,run:()=>{closeAll();openEntry(x.e.id)}})).concat(nav.filter(n=>n.t.toLowerCase().includes(q.toLowerCase()))):nav;
  pal={i:0,items};
  $('#pall').innerHTML=items.length?items.map((it,n)=>`<li><button data-pal="${n}" class="${n===0?'sel':''}">${icon(it.i)}<span style="flex:1">${esc(it.t)}</span>${it.sub?`<span class="muted" style="font-size:12.5px">${it.sub}</span>`:''}</button></li>`).join(''):'<li class="empty" style="padding:14px">Nothing found. Try the Ask page to send it to a department.</li>';
}
function palMove(d){
  if(!pal.items.length)return;
  pal.i=(pal.i+d+pal.items.length)%pal.items.length;
  $$('#pall button').forEach((b,n)=>b.classList.toggle('sel',n===pal.i));
  const s=$('#pall button.sel');if(s)s.scrollIntoView({block:'nearest'});
}
$('#palq').addEventListener('input',e=>palList(e.target.value));
$('#palq').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palMove(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();palMove(-1)}
  else if(e.key==='Enter'){e.preventDefault();const it=pal.items[pal.i];if(it){closeAll();it.run()}}
});

/* ---------- toast & misc ---------- */
let tt=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt).then(()=>true).catch(()=>fallbackCopy(txt))}
  return Promise.resolve(fallbackCopy(txt));
}
function fallbackCopy(txt){try{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Type','Title','Answer','Owner','Validated days ago','Version','Review every (days)']].concat(live().map(e=>[TYPES[e.type].label,e.title,e.answer,DEPTS[e.dept].name,e.days,e.version,e.reviewEvery]));
  const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hub-library.csv';document.body.appendChild(a);a.click();a.remove();
  toast('Library exported');
}

/* ---------- actions ---------- */
const ACT={
  go:t=>go(t.dataset.id),
  open:t=>openEntry(t.dataset.id),
  closeall:closeAll,
  sugg:t=>{curQ=t.dataset.q;const i=$('#q');if(i){i.value=curQ;i.focus()}showResults();logSearch(curQ,true)},
  copy:t=>{const e=byId(t.dataset.id);if(!e)return;copyText(e.title+'\n'+e.answer+(e.points.length?'\n- '+e.points.join('\n- '):'')).then(ok=>toast(ok?'Answer copied':'Could not copy. Select the text instead'))},
  pin:t=>{const id=t.dataset.id,i=S.pins.indexOf(id);if(i>=0)S.pins.splice(i,1);else S.pins.push(id);save();toast(i>=0?'Unpinned':'Pinned to your home');openEntry(id);if(page==='ask'&&!curQ)showResults()},
  vote:t=>{const id=t.dataset.id,v=t.dataset.v,e=byId(id);if(!e)return;const prev=S.votes[id];if(prev==='up')e.up--;if(prev==='down')e.down--;if(prev===v){delete S.votes[id]}else{S.votes[id]=v;if(v==='up')e.up++;else e.down++}save();toast(S.votes[id]?(v==='up'?'Thanks, noted':'Thanks. We will flag this for review'):'Feedback removed');if(v==='down'&&S.votes[id]){e.flags++;save()}rerenderFeedback(id)},
  flag:t=>{const e=byId(t.dataset.id);if(!e)return;e.flags++;save();toast(`Reported to ${DEPTS[e.dept].name} for revalidation`);renderRail()},
  newEntry:()=>{if(!canManage()){toast('Only department users can add content');return}entryForm()},
  processUploads:()=>{const i=$('#docUpload');processUploads(Array.from((i&&i.files)||[]))},
  sampleDoc:()=>processUploads([new File([SAMPLE_DOC],'Sample billing guidance.txt',{type:'text/plain'})]),
  undoBatch:t=>{const b=t.dataset.id;S.entries=S.entries.filter(e=>e.batch!==b);upCards=upCards.filter(c=>c.batch!==b);save();toast('Upload removed');renderLibrary();renderRail()},
  newRequest:t=>requestForm(t.dataset.q,t.dataset.dept),
  answerReq:t=>answerForm(t.dataset.id),
  reqtab:t=>{reqTab=t.dataset.id;renderRequests()},
  libtype:t=>{LIB.type=t.dataset.id;renderLibrary()},
  approve:t=>{if(S.role!=='compliance'){toast('Only Compliance can approve');return}const e=byId(t.dataset.id);if(!e)return;e.status='validated';e.days=0;save();toast('Published. It is now searchable');render()},
  sendBack:t=>{if(S.role!=='compliance')return;const e=byId(t.dataset.id);if(!e)return;e.status='draft';save();toast('Sent back to '+DEPTS[e.dept].name);render()},
  resubmit:t=>{const e=byId(t.dataset.id);if(!e)return;e.status='review';e.submittedAt=Date.now();save();toast('Submitted to Compliance');render()},
  revalidate:t=>{const e=byId(t.dataset.id);if(!e)return;e.days=0;e.flags=0;e.version++;save();toast('Marked as still correct');render()},
  theme:()=>{const cur=document.documentElement.dataset.theme;S.theme=cur==='dark'?'light':'dark';save();applyTheme()},
  rolemenu:()=>{$('#rolemenu').classList.toggle('open')},
  mobilerole:()=>{go('ask');setTimeout(()=>{$('#rolemenu').classList.add('open')},0)},
  role:t=>{S.role=t.dataset.id;curQ='';if(!allowedPage(page))page='ask';save();toast('Now viewing as '+role().name);render()},
  palette:openPalette,
  reset:()=>{if(confirm('Reset all sample data, pins and requests?')){S=seed();save();curQ='';applyTheme();toast('Sample data reset');go('ask')}},
  exportCsv:exportCsv,
  nodeinfo:t=>{
    const id=t.dataset.id,r=ROLES.find(x=>x.id===id),d=DEPTS[id];
    $$('.cn').forEach(n=>n.classList.remove('pick'));const g=$('#n-'+id);if(g)g.classList.add('pick');
    const title=id==='hub'?'Single source of truth':(r?r.name:id);
    const extra=id==='hub'?'':`<button class="btn sm" style="margin-top:14px" data-act="viewas" data-id="${id}">View the hub as ${esc(title)}</button>`;
    $('#nodepanel').innerHTML=`<h3>${esc(title)}</h3><p>${esc(NODEINFO[id]||'')}</p>${extra}`;
  },
  viewas:t=>{S.role=t.dataset.id;save();toast('Now viewing as '+role().name);go('ask')}
};
function rerenderFeedback(id){
  $$('.fb').forEach(f=>{const b=f.querySelector('[data-id="'+id+'"]');if(b){const tmp=document.createElement('div');tmp.innerHTML=feedback(id);f.replaceWith(tmp.firstElementChild)}});
}
document.addEventListener('click',ev=>{
  const p=ev.target.closest('[data-pal]');
  if(p){const it=pal.items[+p.dataset.pal];if(it){closeAll();it.run()}return}
  const t=ev.target.closest('[data-act]');
  if(!t){const rm=$('#rolemenu');if(rm&&!ev.target.closest('.rolebox'))rm.classList.remove('open');return}
  if(!t.dataset.act)return;
  const fn=ACT[t.dataset.act];if(fn)fn(t,ev);
});
document.addEventListener('change',ev=>{
  const c=ev.target.closest('[data-step]');
  if(c){const [id,i]=c.dataset.step.split(':'),n=+i;const a=S.done[id]||(S.done[id]=[]);const k=a.indexOf(n);if(c.checked&&k<0)a.push(n);if(!c.checked&&k>=0)a.splice(k,1);save()}
});
document.addEventListener('input',ev=>{
  const r=ev.target.closest('[data-case]');
  if(r){CASE[r.dataset.case]=+r.value;const o=$('#o-'+r.dataset.case);if(o)o.textContent=r.value+(r.dataset.suf||'');calc()}
});
document.addEventListener('keydown',ev=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||''));
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openPalette();return}
  if(ev.key==='Escape'){closeAll();return}
  if(ev.key==='/'&&!typing){ev.preventDefault();if(page!=='ask')go('ask');setTimeout(()=>{const i=$('#q');if(i)i.focus()},30)}
});
window.addEventListener('hashchange',()=>{const p=(location.hash||'').replace('#/','');if(PAGES[p]&&p!==page){page=allowedPage(p)?p:'ask';render()}});
window.addEventListener('resize',()=>{const mr=$('#mobrole');if(mr)mr.style.display=window.innerWidth<=860?'inline-flex':'none'});

/* ---------- boot ---------- */
if(!/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||'')){}else{$('#kbdhint').textContent='\u2318K'}
applyTheme();
const h=(location.hash||'').replace('#/','');if(PAGES[h])page=h;
render();
window.__sih={search,seed,render,go,S:()=>S};
})();
</script>
</body>
</html>
